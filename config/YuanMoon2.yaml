# 基础设置 (根据常见习惯补充，源文件未提供)
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: :9090

# DNS 设置
dns:
  enable: true
  ipv6: false
  listen: 127.0.0.1:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    - https://dns.quad9.net/dns-query
    - https://dns.nextdns.io/xxxxxx   # 请替换为你的 NextDNS ID
  fallback:
    - tls://8.8.4.4:853
    - tls://1.0.0.1:853
    - tls://9.9.9.9:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

# 代理提供者 (源文件没有节点信息，必须添加此项以供策略组筛选)
proxy-providers:
  🛫 我的订阅:
    type: http
    url: "https://你的订阅链接.com/api/v1/client/subscribe?token=xxxx" # ⚠️ 请在此填入你的机场订阅链接
    interval: 3600
    path: ./sub/my_nodes.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

# 策略组设置
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🚀 手动切换
      - 🇺🇲 美国节点
      - 🇯🇵 日本节点
      - 🇰🇷 韩国节点
      - 🇨🇳 台湾节点
      - 🇭🇰 香港节点
      - 🇸🇬 狮城节点
      - 🇮🇳 印度节点
      - 🇻🇳 越南节点
      - 🇦🇺 澳大利亚节点
      - 🇫🇷 法国节点
      - 🇮🇱 以色列节点
      - 🇨🇦 加拿大节点
      - DIRECT

  - name: ♻️ 自动选择
    type: url-test
    interval: 300
    tolerance: 100
    include-all: true
    timeout: 3000
    # 排除 CN, HK, SG, RU 等地区的正则
    filter: "^(?!(CN|华为|香港|港|HK|Hong Kong|Hongkong|🇭🇰|Hong Kong|HongKong|新加坡|坡|狮城|SG|Singapore|俄罗斯|RU|直连)).*$"
    url: http://www.gstatic.com/generate_204
    lazy: true
    max-failed-times: 3
    hidden: false

  - name: 🚀 手动切换
    type: url-test # 源文件定义为 url-test
    #use:
